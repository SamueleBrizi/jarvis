name: Compila Jarvis

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Spacchetta gli zip caricati
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then echo "Nessuno zip da spacchettare"; exit 0; fi
          for z in "${zips[@]}"; do
            unzip -o "$z" -x '.github/*' -d _unz
            inner=$(find _unz -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -1)
            if [ -n "$inner" ] && [ "$inner" != "_unz" ]; then cp -a "$inner"/. . ; else cp -a _unz/. . ; fi
            rm -rf _unz
            git rm -q --cached "$z" 2>/dev/null || true
            rm -f "$z"
          done
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add -A
          git commit -m "Applicato pacchetto: ${zips[*]}" || true
          git push || true

      - name: Controlla progetto
        id: check
        run: |
          if [ -f settings.gradle.kts ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.ok == 'true'
        with:
          gradle-version: "8.11.1"

      - name: Compila APK
        if: steps.check.outputs.ok == 'true'
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Pubblica in Releases
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="2.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "Jarvis-$V.apk"
          gh release create "v$V" "Jarvis-$V.apk" --title "Jarvis $V" \
            --notes "Scarica Jarvis-$V.apk e installalo sopra la versione precedente." --latest
          gh release list --limit 50 --json tagName -q '.[3:][].tagName' | xargs -r -I{} gh release delete {} --yes --cleanup-tag
